<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>同人-購入済み一覧</title>

        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="page">
            <div id="wrap">
                <header>
                    <h1>同人-購入済み一覧</h1>
                </header>
                <div id="tool">
                    <input type="file" name="json" id="file_input" />
                    <input type="search" id="search_input" placeholder="検索" />
                    <div id="genre_dropdown">
                        <button type="button" id="genre_toggle">ジャンル</button>
                        <div id="genre_menu"></div>
                    </div>
                    <select id="sort_select">
                        <option value="default">デフォルト順</option>
                        <option value="title_asc">タイトル昇順</option>
                        <option value="title_desc">タイトル降順</option>
                        <option value="circle_asc">サークル名昇順</option>
                        <option value="circle_desc">サークル名降順</option>
                    </select>
                    <label id="favorite_only_label">
                        <input type="checkbox" id="favorite_only" />
                        お気に入りのみ
                    </label>
                </div>
                <div id="container"></div>
                <div id="sentinel"></div>
            </div>
        </div>
    </body>
</html>
